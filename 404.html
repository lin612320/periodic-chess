<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不在了 · 元素周期表飞行棋</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(78% 54% at 74% 26%, #ff9a6b 0%, transparent 62%),
      linear-gradient(178deg, #c2506f 0%, #2b1740 48%, #170a1e 100%);
    color: #f2e8dc;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    text-align: center;
    padding: 24px;
  }
  h1 { font-size: clamp(26px, 5vw, 44px); margin: 0 0 10px; letter-spacing: .06em; }
  p { color: rgba(242, 232, 220, .62); font-size: 14px; line-height: 2; margin: 0 0 24px; }
  a {
    display: inline-block;
    padding: 11px 28px;
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #e0567f, #ff7aa2);
    box-shadow: 0 8px 26px -10px #e0567f;
    font-size: 14px;
    letter-spacing: .1em;
  }
  .z { font-size: 12px; letter-spacing: .3em; color: rgba(242, 232, 220, .34); margin-bottom: 18px; }
</style>
</head>
<body>
  <div>
    <div class="z">404</div>
    <h1>这一格不在棋盘上</h1>
    <p>1 到 118，没有这个号。<br>回起点重新走一遍？</p>
    <a href="/">回到 1 号氢</a>
  </div>

</html>
